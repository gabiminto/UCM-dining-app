name: Update dining hours

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-hours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official hours
        run: python3 Scripts/update_dining_hours.py
      - name: Open an update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          branch="automation/update-dining-hours"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add Sources/ucm_dining_app/Resources/dining-hours.json
          git commit -m "Update UC Merced dining hours"
          git push --force-with-lease origin "$branch"
          gh pr create --fill --base "${{ github.event.repository.default_branch }}" --head "$branch" || true
